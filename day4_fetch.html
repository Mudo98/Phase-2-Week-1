<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Country Lookup</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f9;
      color: #1f2937;
      display: flex;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.65rem 0.9rem;
      font-size: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
    }

    button {
      padding: 0.65rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .status {
      padding: 0.9rem 1rem;
      border-radius: 8px;
      font-weight: 500;
    }

    .loading {
      background-color: #eff6ff;
      color: #1d4ed8;
    }

    .error {
      background-color: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 1.25rem;
      background-color: #fafafa;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .card-header img {
      width: 60px;
      height: auto;
      border-radius: 4px;
      border: 1px solid #e5e7eb;
    }

    .card-header h2 {
      font-size: 1.25rem;
    }

    .details {
      list-style: none;
      display: grid;
      gap: 0.5rem;
      font-size: 0.95rem;
    }

    .details li span {
      font-weight: 600;
      color: #374151;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Country Finder</h1>
    <p class="subtitle">Search any country to fetch live information.</p>

    <form id="search-form">
      <input
        type="text"
        id="country-input"
        placeholder="e.g., Uganda, Japan, Brazil"
        required
      />
      <button type="submit">Search</button>
    </form>

    <div id="output"></div>
  </div>

  <script>
    const form = document.getElementById("search-form");
    const input = document.getElementById("country-input");
    const output = document.getElementById("output");

    async function fetchCountryData(countryName) {
      // 1. Show loading indicator before the request completes
      output.innerHTML = `<div class="status loading">Loading...</div>`;

      try {
        const encodedName = encodeURIComponent(countryName.trim());
        const response = await fetch(
          `https://restcountries.com{encodedName}`
        );

        // 2. Check for HTTP errors (fetch only rejects on network failures)
        if (!response.ok) {
          throw new Error(
            `Could not find "${countryName}". Please check the spelling and try again.`
          );
        }

        const data = await response.json();
        const country = data[0];

        // Extract formatted fields safely
        const commonName = country.name.common;
        const officialName = country.name.official;
        const capital = country.capital ? country.capital.join(", ") : "N/A";
        const region = country.region || "N/A";
        const population = country.population.toLocaleString();
        const flagUrl = country.flags.svg || country.flags.png;
        const currencies = country.currencies
          ? Object.values(country.currencies)
              .map((c) => `${c.name} (${c.symbol || ""})`)
              .join(", ")
          : "N/A";

        // 3. Display clean, formatted output when the request succeeds
        output.innerHTML = `
          <div class="card">
            <div class="card-header">
              <img src="${flagUrl}" alt="Flag of ${commonName}" />
              <div>
                <h2>${commonName}</h2>
                <small>${officialName}</small>
              </div>
            </div>
            <ul class="details">
              <li><span>Capital:</span> ${capital}</li>
              <li><span>Region:</span> ${region}</li>
              <li><span>Population:</span> ${population}</li>
              <li><span>Currency:</span> ${currencies}</li>
            </ul>
          </div>
        `;
      } catch (error) {
        // 4. Show a clear error message when the request fails
        output.innerHTML = `
          <div class="status error">
            <strong>Error:</strong> ${error.message}
          </div>
        `;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const query = input.value.trim();
      if (query) {
        fetchCountryData(query);
      }
    });
  </script>
</body>
</html>
